global:
  scrape_interval: 15s
  # Prometheus 3 keeps OpenTelemetry metric names as-is (otellix.llm.cost.usd_total).
  # Store them with underscores (otellix_llm_cost_usd_total), which is what the
  # bundled dashboard and the queries in docs/ use.
  metric_name_validation_scheme: legacy
  metric_name_escaping_scheme: underscores

scrape_configs:
  - job_name: 'otellix-demo'
    static_configs:
      - targets: ['otellix-demo:9090']
