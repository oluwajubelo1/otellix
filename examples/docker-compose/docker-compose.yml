services:
  # Redis — shared budget store for distributed enforcement (used by examples/redis-budget)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Otellix demo app — makes mock LLM calls and exposes Prometheus metrics
  otellix-demo:
    build:
      # The app imports otellix from this repo, so build from the repo root.
      context: ../..
      dockerfile: examples/docker-compose/Dockerfile
    ports:
      - "9090:9090"
    environment:
      - METRICS_PORT=9090
    restart: unless-stopped

  # Prometheus — scrapes metrics from the demo app
  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otellix-demo
    restart: unless-stopped

  # Grafana — pre-loaded with Otellix dashboard
  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
