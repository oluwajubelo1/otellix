name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Formatter verification
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted:"
            echo "$UNFORMATTED"
            echo "Please run 'gofmt -w .' on these files and push again."
            exit 1
          fi

      - name: Run testing and generate coverage
        run: go test -v -race -coverprofile=coverage.out ./...
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          file: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  fiber:
    name: Fiber middleware module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: middleware/fiber

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: middleware/fiber/go.mod
          check-latest: true

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Run tests
        run: go test -v -race ./...
